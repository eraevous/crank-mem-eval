requirement: |
  fileFacts must admit file content only through a confinement gate
  establishing that the resolved target is within the resolved repository
  root and that the opened descriptor refers to a regular file.

  Final-component symlink substitution between path validation and open
  is in scope. The open must use O_NOFOLLOW. If that protection is
  unavailable or the protected open fails, admission must fail closed;
  an unprotected fallback is not permitted.

  Each successful fileFacts operation must use one file descriptor for
  target-file content access. Size and modification time must come from
  that descriptor. Content-derived facts, including token estimates,
  description, and generated-file classification, must derive from bytes
  read through it, without reopening a pathname. Descriptive filename
  rules may use the admitted path.

  Refused admission must return no facts. A caller updating stored facts
  must remove an existing row for that path rather than retain or insert
  facts from a refused operation.

  Adversarial replacement of ancestor directories during validation,
  open, or reading is out of scope. This requirement does not claim
  race-free confinement against that attacker; O_NOFOLLOW protects only
  the final component.

  This requirement does not guarantee a coherent snapshot under
  concurrent in-place file modification, nor does it require callers
  to revalidate cached rows on paths where fileFacts is not invoked.
