# This line's own test gate (bun / TypeScript). v0.16's release.yml checks a tag but runs no tests;
# Kairos's shared Lydian suite runs Python only, so the TypeScript suite runs here.
name: ci
on:
  push:
    # crk/** too: a PR whose branch conflicts with main (as the v0.16 rebase does) gets no
    # pull_request run, since GitHub can't build its merge commit.
    branches: [main, "crk/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun install --frozen-lockfile
      - run: cd dashboard && bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run lint:health
      # The suite reads the real local search model and the built dashboard; setup provides both.
      - run: bun src/cli/main.ts setup
      - run: bun run test
        env:
          # The digest and daemon tests expect TMPDIR among the variables passed to claude;
          # GitHub's Linux runners don't set it. (runner.temp is only available at step level.)
          TMPDIR: ${{ runner.temp }}
