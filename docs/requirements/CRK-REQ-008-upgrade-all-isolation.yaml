requirement: >-
  crank-mem upgrade --all must attempt repair of every registered
  project even when another project's repair throws. Each throwing
  project must be reported on stderr as "<root>: failed (<reason>)".
  If any project repair fails, the command must exit with status 1.
test_behavior:
  - >-
    Register at least two projects in a deterministic order. Make the
    earlier project's repair throw, for example by making config.json
    a directory, and leave a later project needing an observable repair.
  - >-
    Invoke upgrade --all; assert that stderr identifies the throwing
    project's root and failure reason in the required format.
  - >-
    Assert that the later project's repair completed despite the earlier
    exception, and that the process exits with status 1.
out_of_scope:
  - Rolling back repairs already completed in other projects.
  - Guaranteeing successful repair of the project that throws.
  - Continuing after process termination or registry enumeration failure.
