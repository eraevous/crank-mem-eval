requirement: >-
  When reconciling Codex hook trust, crank-mem must grant trust only
  to commands matching an explicitly supported exact generated form
  and remove any crank-mem-managed trust entry for a command that
  no longer matches.
test_behavior:
  - >-
    Exact supported generated commands receive the expected trust
    entry, and repeated reconciliation is idempotent.
  - >-
    A command containing the expected hook path but with appended
    shell receives no trust.
  - >-
    A pre-existing crank-mem-managed trust entry for that edited
    command is removed during reconciliation.
  - >-
    Unrelated user-managed trust entries remain unchanged.
out_of_scope:
  - Authenticating command provenance or hook-file contents.
  - Changing Codex's own trust enforcement.
  - Revoking unrelated user-managed trust.
