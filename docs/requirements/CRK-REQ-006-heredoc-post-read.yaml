requirement: |
  When identifying files read by a Bash command, heredoc removal must
  respect Bash delimiter handling for supported heredoc forms.
  It must not swallow commands following a completed heredoc or
  mistake a here-string for a heredoc body.
acceptance:
  - |
    For <<-, recognize a matching terminator preceded by tabs.
    Leading spaces must not receive the same treatment.
  - |
    For ordinary <<, a tab-prefixed delimiter is not a terminator.
  - |
    Treat <<< as a here-string with no subsequent heredoc body.
  - |
    File reads occurring after a valid heredoc terminator, or after
    a here-string, remain discoverable.
  - |
    Heredoc body text resembling file-reading commands does not
    produce file-read findings.
assessment: not assessed
