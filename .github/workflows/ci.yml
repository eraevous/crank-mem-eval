# This repo's own checks (bun / TypeScript). Lydian's shared suite runs Python unittest only,
# so the TypeScript tests live here; Lydian runs the Telosmith records check (kairos.yml).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/installer.test.ts installs the parent commit (--ref), which a shallow clone lacks
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: cd dashboard && bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      # The suite reads the real local search model; setup downloads it into ~/.crank.
      - run: bun src/cli/main.ts setup --skip-dashboard
      - run: bun test --timeout 20000
        env:
          # The digest and daemon tests expect TMPDIR among the variables passed to claude;
          # macOS always sets it, GitHub's Linux runners don't. (runner.temp is only
          # available at step level, not in job-level env.)
          TMPDIR: ${{ runner.temp }}
