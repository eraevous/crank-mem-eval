requirement: >-
  self-install must encode the bin directory in its shell startup line
  as one literal argument, without expanding variables or executing shell
  substitutions contained in the directory name. For sh/bash/zsh, emit
  export PATH='<bin>':"$PATH", encoding each apostrophe in <bin> as '\''.
  For fish, emit fish_add_path '<bin>', escaping backslashes and
  apostrophes for fish single-quoted strings. Removal must continue
  identifying the installed block by its markers.
test_behavior:
  - >-
    Source the generated sh line with a bin directory containing a space,
    literal $HOME, a backquoted command, and an apostrophe. Assert PATH
    equals the original bin directory followed by ":" and the old PATH,
    byte for byte.
  - >-
    Assert that the backquoted command does not execute, using an
    observable sentinel rather than PATH equality alone.
  - >-
    Pin the generated fish escaping for a directory containing both
    backslashes and apostrophes; when fish is available, verify that the
    generated command receives the unchanged directory as one argument.
  - >-
    Remove an installed block containing the adversarial directory and
    verify that its markers and contents disappear while unrelated
    startup-file content remains unchanged.
out_of_scope:
  - Installer download, release selection, and executable installation.
  - Changing fish_add_path ordering or deduplication semantics.
