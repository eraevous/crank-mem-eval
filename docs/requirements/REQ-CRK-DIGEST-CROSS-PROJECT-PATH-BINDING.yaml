id: REQ-CRK-DIGEST-CROSS-PROJECT-PATH-BINDING
authored_by: chatgpt:kate
author_role: independent
source: Round 11 routing-fix ask, Codex security P2
target_revision: abf85b7
requirement: >-
  When a digest copies an observation into another installed project's store, it must retain only that
  target project's paths identified by `ownedPaths(cwd, transcript tool-call paths)`, remove all other
  paths and project references from that copy, and create no row for a target with no retained paths,
  without changing entry-project path handling.
tests_must_show:
  - An untouched installed project receives no row.
  - A touched project's copy retains the named/read file.
  - That copy excludes an unnamed sibling and the untouched-project reference.
  - Each recipient is filtered independently.
  - Entry-project path handling remains unchanged.
out_of_scope:
  - Binding the entry project's own unnamed paths.
  - Changes to existing proposal and stale-flag project binding.
  - Proving that a named tool-call path was successfully read.
  - General validation of observation prose.
