requirement: >-
  The crank-mem launcher must invoke Bun with automatic working-directory
  dotenv loading disabled so those files cannot supply crank-mem settings,
  including the release origin.
test_behavior:
  - >-
    Execute the actual launcher from a directory containing
    Bun-recognized dotenv files that set a hostile release-origin value,
    and observe that the effective release origin remains the expected
    value from the controlled baseline environment.
  - >-
    Observe that an additional dotenv-only sentinel is absent from the
    launched crank-mem process environment.
out_of_scope:
  - Rejecting settings explicitly supplied through the inherited environment.
  - Direct Bun invocations that bypass the launcher.
  - Release authenticity or download verification.
