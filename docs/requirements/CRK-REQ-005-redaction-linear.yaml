    Exercise keyed-value and URL-credential matching separately,
    and the complete redactor, using "a-" repeated 40,000 times.
    The complete-redactor regression test must finish under 300 ms
    in the designated test environment.
  - |
    Use increasing input sizes and algorithm inspection to assess
    linear scaling; one timing threshold alone is insufficient.
  - |
    Retain positive regression fixtures for v0.16 masking behavior,
    including keyed secrets and URL credentials.
  - |
    APP__SECRET=abc is masked.
  - |
    MAX_TOKENS=4096, token_count = 5, and password_hint: blue
    remain unmasked.
